appId: com.claude-in-wechat.app
productName: "Claude in WeChat"
copyright: "Copyright (c) 2024 Claude in WeChat"

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  artifactName: "${productName}-Setup-${version}.${ext}"
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Claude in WeChat"
  license: LICENSE
  language: "2052"
  displayLanguageSelector: false
  multiLanguageInstaller: true

publish:
  provider: github
  owner: DDNdles
  repo: Claude-in-Wechat
